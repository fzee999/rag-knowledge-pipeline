[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-pipeline"
version = "0.1.0"
description = "Document ingestion, chunking, embeddings and vector search for grounded Q&A over enterprise content, answered by Claude."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-ollama>=1.0",
    "langchain-anthropic>=1.7",
    "langchain-chroma>=1.0",
    "fastembed>=0.7",
    "rank-bm25>=0.2",
    "pypdf>=5.0",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ragpipe = "ragpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    # Fake test embeddings aren't normalized, so cosine relevance can fall outside [0, 1].
    "ignore:Relevance scores must be between 0 and 1",
]
